# kanal UI catalog -- single source of truth for all dynamic tabs.
#
# Top-level: tabs (ordered list; rendered after the fixed Channel + Machine tabs)
#
# Tab fields:
#   id          - internal identifier; matches the GTK stack child name
#   title       - sidebar label
#   description - shown as group description
#   presets     - optional list of presets for which the tab is shown and saved
#   type        - storage model:
#                   bool_options  -- each item is a separate bool NixOS option
#                   list_option   -- all checked item ids written as one Nix list
#   nix_key     - (list_option) NixOS option key for the list
#   save_cmd    - kanalctl subcommand (for reference)
#   items       - SwitchRow entries
#
# bool_options item fields: key, id, const, title, subtitle, default[, extra]
# list_option  item fields: id, title, subtitle, default
#
# extra (bool_options only):
#   type: gnome_extension  -> value synced into notenix.desktop.gnome.extensions

# Machine identity fields written to machine.nix.
# Each entry: id (Python constant suffix), nix_key, cli_flag
machine:
  groups:
    - id: identity
      title: Identity
    - id: locale
      title: Locale
    - id: system
      title: System
  fields:
    - id: hostname
      nix_key: notenix.system.install.hostName
      cli_flag: --hostname
      label: Hostname
      group: identity
      widget: entry
    - id: username
      nix_key: notenix.system.install.userName
      cli_flag: --username
      label: Username
      group: identity
      widget: entry
    - id: userdesc
      nix_key: notenix.system.install.userDescription
      cli_flag: --userdesc
      label: Full name
      group: identity
      widget: entry
    - id: timezone
      nix_key: notenix.system.install.timeZone
      cli_flag: --timezone
      label: Timezone
      group: locale
      widget: entry
    - id: locale
      nix_key: notenix.system.install.locale
      cli_flag: --locale
      label: Language
      group: locale
      widget: dropdown_locale
    - id: kblayout
      nix_key: notenix.system.install.keyboardLayout
      cli_flag: --kblayout
      label: Keyboard layout
      group: locale
      widget: dropdown_kbd
    - id: stateversion
      nix_key: system.stateVersion
      cli_flag: --stateversion
      label: State version
      subtitle: Set at install time - do not change
      group: system
      widget: readonly

tabs:
  - id: features
    title: Features
    description: "These are applied on top of the selected preset"
    type: bool_options
    save_cmd: set-features
    items:
      - key: notenix.features.canonPrinter
        id: canonPrinter
        const: CANON_PRINTER
        title: Canon printer
        subtitle: "UFR II drivers for Canon LBP/MF series (e.g. LBP633CDW)"
        default: false

      - key: notenix.features.kiosk
        id: kiosk
        const: KIOSK
        title: Kiosk mode
        subtitle: "Auto-login, no screen lock"
        default: false

      - key: notenix.features.logitechWireless
        id: logitechWireless
        const: LOGITECH_WIRELESS
        title: Logitech Wireless
        subtitle: "Solaar device manager + udev rules for Unifying/Bolt receivers"
        default: false

      - key: notenix.features.nvidia
        id: nvidia
        const: NVIDIA
        title: NVIDIA drivers
        subtitle: "Proprietary NVIDIA graphics drivers"
        default: false

      - key: notenix.features.rustdesk
        id: rustdesk
        const: RUSTDESK
        title: RustDesk
        subtitle: "Remote desktop -- allows controlling this machine remotely"
        default: false

      - key: notenix.features.ssh
        id: ssh
        const: SSH
        title: SSH server
        subtitle: "OpenSSH -- password auth, root login disabled"
        default: false

      - key: notenix.features.powerOffLauncher
        id: powerOffLauncher
        const: POWER_OFF_LAUNCHER
        title: Power Off launcher
        subtitle: "Add a Power Off icon to the desktop dock"
        default: false

      - key: notenix.features.steam
        id: steam
        const: STEAM
        title: Steam
        subtitle: "Valve Steam game client with hardware controller support"
        default: false

      - key: notenix.features.swap
        id: swap
        const: SWAP
        title: Swap
        subtitle: "4 GiB swapfile + zram compressed swap"
        default: true

      - key: notenix.features.tailscale
        id: tailscale
        const: TAILSCALE
        title: Tailscale
        subtitle: "Tailscale VPN (adds status indicator to GNOME top bar)"
        default: false
        extra:
          type: gnome_extension
          value: tailscale-status

      - key: notenix.features.zfs
        id: zfs
        const: ZFS
        title: ZFS support
        subtitle: "Enable ZFS kernel module for mounting ZFS pools"
        default: false

      - key: notenix.features.experimental
        id: experimental
        const: EXPERIMENTAL
        title: Experimental
        subtitle: "Unlock alternative package sources — unstable or upstream (may cause instability)"
        default: false

  - id: extensions
    title: Extensions
    description: "Enabled on next rebuild (only applies to GNOME desktop preset)"
    presets: [ desktop ]
    type: list_option
    nix_key: notenix.desktop.gnome.extensions
    save_cmd: set-extensions
    items:
      - id: appindicator
        title: AppIndicator
        subtitle: "System tray icon support"
        default: true

      - id: dash-to-dock
        title: Dash to Dock
        subtitle: "Customisable dock panel"
        default: true

      - id: gtk4-desktop-icons-ng-ding
        title: Desktop Icons NG
        subtitle: "Show files and folders on the desktop"
        default: false
        nix_source_key: notenix.desktop.gnome.dingSource
        nix_hash_key: notenix.desktop.gnome.dingSourceHash
        sources:
          - id: unstable
            label: "Unstable (nixpkgs-unstable)"
            default: true
          - id: stable
            label: "Stable (nixpkgs)"
          - id: upstream-main
            label: "Upstream main"
            fetch_url: "https://gitlab.com/smedius/desktop-icons-ng/-/archive/main/desktop-icons-ng-main.tar.gz"

      - id: gsconnect
        title: GSConnect
        subtitle: "KDE Connect integration -- pair with Android"
        default: true

      - id: tailscale-status
        title: Tailscale Status
        subtitle: "Tailscale VPN status indicator in the top bar"
        default: false

  - id: apps
    title: Apps
    description: "Apps installed from Flathub on next rebuild"
    type: list_option
    nix_key: notenix.applications.flatpak.packages
    save_cmd: set-apps
    items:
      - id: org.chromium.Chromium
        title: Chromium
        subtitle: "Web browser"
        default: false

      - id: com.google.Chrome
        title: Google Chrome
        subtitle: "Web browser"
        default: false

      - id: chromium
        title: Chromium (Snap)
        subtitle: "Web browser from the Snap Store"
        default: false
        source: snap

      - id: ms-solitaire
        title: Microsoft Solitaire
        subtitle: "Microsoft Solitaire from Windows XP (Snap)"
        default: false
        source: snap

      - id: com.github.tchx84.Flatseal
        title: Flatseal
        subtitle: "Manage Flatpak permissions"
        default: false

      - id: org.libreoffice.LibreOffice
        title: LibreOffice
        subtitle: "Full office suite -- Writer, Calc, Impress"
        default: false

      - id: org.nextcloud.Nextcloud
        title: Nextcloud
        subtitle: "Sync files and folders with Nextcloud"
        default: false

      - id: com.obsproject.Studio
        title: OBS Studio
        subtitle: "Screen recording and streaming"
        default: false

      - id: com.rustdesk.RustDesk
        title: RustDesk
        subtitle: "Remote desktop"
        default: false

      - id: org.signal.Signal
        title: Signal
        subtitle: "Encrypted messaging"
        default: false

      - id: org.videolan.VLC
        title: VLC
        subtitle: "Media player"
        default: false

      - id: com.vscodium.codium
        title: VSCodium
        subtitle: "Code editor"
        default: false
